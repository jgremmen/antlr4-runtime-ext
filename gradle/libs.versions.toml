[versions]
# antlr4-runtime-ext version
antlr4-runtime-ext = '0.7.1-SNAPSHOT'

antlr4 = '4.13.2'
jetbrains-annotations = '[24.0,26.2)'
junit = '6.1.+'
lombok = '1.18.+'

[libraries]
antlr4 = { group = 'org.antlr', name = 'antlr4', version.ref = 'antlr4' }
antlr4-runtime = { group = 'org.antlr', name = 'antlr4-runtime', version.ref = 'antlr4' }
jetbrains-annotations = { group = 'org.jetbrains', name = 'annotations', version.ref = 'jetbrains-annotations' }
junit-jupiter-api = { group = 'org.junit.jupiter', name = 'junit-jupiter-api', version.ref = 'junit' }
junit-jupiter-engine = { group = 'org.junit.jupiter', name = 'junit-jupiter-engine', version.ref = 'junit' }
lombok = { group = 'org.projectlombok', name = 'lombok', version.ref = 'lombok' }
